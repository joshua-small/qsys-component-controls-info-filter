name: Portable regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Run portable behavior checks
        run: dotnet run --project tests/Portable/ComponentControlsInfoFilter.PortableTests.csproj --configuration Release
